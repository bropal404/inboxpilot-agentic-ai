services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: platform-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092

  minio:
    image: minio/minio:latest
    container_name: platform-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    command: server /data --console-address ":9001"
    networks:
      - platform-net

  redis:
    image: redis:latest
    container_name: platform-redis
    ports:
      - "6379:6379"
    networks:
      - platform-net

  orchestrator:
    build:
      context: ./orchestrator
    container_name: platform-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Also mount the root repo directory so the orchestrator can build AGENTIC_AI_APP
      - ./..:/app_repo
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - platform-net
    depends_on:
      - kafka

  frontend:
    build:
      context: ./frontend
    container_name: platform-frontend
    ports:
      - "3000:3000"
    networks:
      - platform-net
    privileged: true

networks:
  platform-net:
    name: platform-net
    driver: bridge
