version: "3.9"

services:
  repo:
    build:
      context: .
      dockerfile: repo-server/Dockerfile
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 5
    networks:
      - platform

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    networks:
      - platform

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - platform

  supervisor:
    build:
      context: .
      dockerfile: services/supervisor/Dockerfile
    depends_on:
      - kafka
    environment:
      - ROLE=Master
      - REPO_URL=http://repo:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - platform
    ports:
      - "5001:5000"

  runtime-orch-1:
    build:
      context: .
      dockerfile: services/agent-node/Dockerfile
    depends_on:
      - supervisor
    environment:
      - NODE_ROLE=orchestrator
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - platform

  runtime-agent-1:
    build:
      context: .
      dockerfile: services/agent-node/Dockerfile
    depends_on:
      - supervisor
    environment:
      - NODE_ROLE=classify
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - platform
      
  runtime-agent-2:
    build:
      context: .
      dockerfile: services/agent-node/Dockerfile
    depends_on:
      - supervisor
    environment:
      - NODE_ROLE=fetch
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - platform

networks:
  platform:
    driver: bridge
