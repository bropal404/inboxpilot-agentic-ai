[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxpilot"
version = "1.0.0"
description = "Agentic AI Email Assistant"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
distributed = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
inboxpilot = "inboxpilot.cli:cli"
inboxpilot-dist = "services.supervisor.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["inboxpilot*", "a2a*", "services*"]
